spring.application.name=uco-test-gateway
server.port=${PORT:8081}

# A donde se reenvian las peticiones: la API. En la nube llega por variable de entorno.
api.url=${API_URL:http://localhost:8080}

# Ruta 1: registrar notas y abrir sesion, con limite de peticiones por IP (5 por segundo, rafagas de 10).
# Protege el registro de notas y frena los intentos de adivinar contrasenas.
spring.cloud.gateway.server.webflux.routes[0].id=api-limitada
spring.cloud.gateway.server.webflux.routes[0].uri=${api.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/notas-estudiantes,/api/v1/auth/login,/api/v1/auth/registro,/api/v1/auth/recuperar-clave,/api/v1/auth/restablecer-clave
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@llavePorIp}

# Ruta 2: el resto de la API.
spring.cloud.gateway.server.webflux.routes[1].id=api
spring.cloud.gateway.server.webflux.routes[1].uri=${api.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/**

# Ruta 3: la salud de la API, para revisar desde afuera que el gateway llega a ella.
spring.cloud.gateway.server.webflux.routes[2].id=salud-api
spring.cloud.gateway.server.webflux.routes[2].uri=${api.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/salud-api
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/actuator/health

# Ruta 4: la pagina web (archivos estaticos que sirve la API).
spring.cloud.gateway.server.webflux.routes[3].id=pagina
spring.cloud.gateway.server.webflux.routes[3].uri=${api.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/,/index.html,/*.css,/*.js,/favicon.ico
spring.cloud.gateway.server.webflux.routes[3].predicates[1]=Method=GET

# Todas las respuestas dicen que pasaron por el gateway.
spring.cloud.gateway.server.webflux.default-filters[0]=AddResponseHeader=X-Gateway, uco-test-gateway

# Render gratis tarda en despertar la API: se le da tiempo a la primera peticion.
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=10000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=90s

# Redis guarda los contadores del limite. En la nube REDIS_URL llega del vault (Upstash).
# Si Redis falla, el limite deja pasar las peticiones en vez de bloquear la API.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
management.health.redis.enabled=false
management.endpoints.web.exposure.include=health
