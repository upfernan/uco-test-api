# Blueprint de Render: crea la API (plan gratis).
# La base de datos es Neon (PostgreSQL gratis que no vence). Su cadena de conexion es un secreto:
# Render la pide al crear el Blueprint (sync: false) y nunca queda en el repositorio.
services:
  - type: web
    name: uco-test-api
    runtime: docker
    plan: free               # Gratis. Se duerme a los 15 min sin uso y tarda ~1 min en despertar.
    region: virginia
    branch: main
    autoDeployTrigger: "off"   # CD: despliega el trabajo "desplegar" de GitHub Actions cuando todo pasa.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false

  # API Gateway: la puerta de entrada. Reenvia /api/** a la API y limita las peticiones por IP.
  - type: web
    name: uco-test-gateway
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: "off"
    rootDir: gateway
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: API_URL
        value: https://uco-test-api.onrender.com
      - key: REDIS_URL
        sync: false
