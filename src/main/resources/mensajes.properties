# Catalogo de mensajes. {0}, {1}... se reemplazan por los parametros.

ESTUDIANTE_ID_NULO=El ID del estudiante no puede ser nulo
ESTUDIANTE_NO_EXISTE=El estudiante con ID {0} no existe

DOCENTE_ID_NULO=El ID del docente no puede ser nulo
DOCENTE_NO_EXISTE=El docente con ID {0} no existe
DOCENTE_NO_ACTIVO=El docente con ID {0} no está activo

GRUPO_ID_NULO=El ID del grupo no puede ser nulo
GRUPO_NO_EXISTE=El grupo con ID {0} no existe
GRUPO_NO_ACTIVO=El grupo con ID {0} no está activo
GRUPO_NO_VIGENTE=El grupo con ID {0} no está vigente
DOCENTE_NO_ASIGNADO_AL_GRUPO=El docente con ID {0} no está asignado al grupo {1}

ESTUDIANTE_GRUPO_IDS_NULOS=El ID del estudiante y el ID del grupo no pueden ser nulos
ESTUDIANTE_NO_PERTENECE_AL_GRUPO=El estudiante con ID {0} no pertenece al grupo {1}

NOTA_ID_NULO=El ID de la nota no puede ser nulo
NOTA_NO_EXISTE=La nota con ID {0} no existe
NOTA_NO_ACTIVA=La nota con ID {0} no está activa
NOTA_FECHA_REGISTRO_NO_VIGENTE=La fecha para registrar la nota con ID {0} no está vigente
NOTA_NO_PERTENECE_AL_GRUPO=La nota con ID {0} no pertenece al grupo {1}

NOTA_ESTUDIANTE_IDS_NULOS=El ID del estudiante y el ID de la nota no pueden ser nulos
NOTA_YA_REGISTRADA=El estudiante con ID {0} ya tiene registrada la nota {1}
VALOR_NOTA_NULO=El valor de la nota no puede ser nulo
VALOR_NOTA_FUERA_DE_RANGO=El valor de la nota debe estar entre 0 y 5
VALOR_NOTA_MAXIMO_DOS_DECIMALES=El valor de la nota debe tener máximo dos decimales

# Mensajes generales y técnicos
REGISTRAR_NOTA_ERROR_INESPERADO_USUARIO=Ocurrió un error inesperado al registrar la nota. Inténtelo de nuevo.
REGISTRAR_NOTA_ERROR_INESPERADO_TECNICO=Error técnico inesperado en RegistrarNotaEstudianteCasoUsoImpl: {0}
REGLA_NEGOCIO_INCUMPLIDA_TECNICO=Regla de negocio incumplida: {0}
DATOS_PETICION_INVALIDOS_USUARIO=La petición contiene datos inválidos. Verifique el formato e inténtelo de nuevo.
DATOS_PETICION_INVALIDOS_TECNICO=Se recibió una petición con datos inválidos (JSON malformado o parámetro con tipo incorrecto).
ERROR_INESPERADO_USUARIO=Ha ocurrido un error inesperado. Inténtelo de nuevo y si el problema persiste contacte a un administrador.
ERROR_INESPERADO_TECNICO=Se generó una excepción no controlada en el sistema. Revisar los logs de errores.
