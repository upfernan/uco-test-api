# Mensajes generales y técnicos
REGISTRAR_NOTA_ERROR_INESPERADO_USUARIO=Ocurrió un error inesperado al registrar la nota. Inténtelo de nuevo.
REGISTRAR_NOTA_ERROR_INESPERADO_TECNICO=Error técnico inesperado en RegistrarNotaEstudianteCasoUsoImpl: {0}
REGLA_NEGOCIO_INCUMPLIDA_TECNICO=Regla de negocio incumplida: {0}
DATOS_PETICION_INVALIDOS_USUARIO=La petición contiene datos inválidos. Verifique el formato e inténtelo de nuevo.
DATOS_PETICION_INVALIDOS_TECNICO=Se recibió una petición con datos inválidos (JSON malformado o parámetro con tipo incorrecto).
ERROR_INESPERADO_USUARIO=Ha ocurrido un error inesperado. Inténtelo de nuevo y si el problema persiste contacte a un administrador.
ERROR_INESPERADO_TECNICO=Se generó una excepción no controlada en el sistema. Revisar los logs de errores.

