spring.application.name=uco-test-api
server.port=${PORT:8080}

spring.messages.basename=mensajes
spring.messages.encoding=UTF-8

# Base de datos: en la nube estos valores llegan por variables de entorno (vault).
# Los valores por defecto son solo para la base local de docker-compose.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ucotestapi}
spring.datasource.username=${DB_USERNAME:ucotestapi}
spring.datasource.password=${DB_PASSWORD:ucotestapi}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Cache en Redis: en la nube REDIS_URL llega del vault (Upstash, rediss://).
# El valor por defecto es el Redis local de docker-compose.
spring.cache.type=redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# Si Redis falla la API sigue respondiendo desde la base, asi que no debe marcar la salud como caida.
management.health.redis.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Notificaciones por correo (Brevo). La clave y el remitente llegan del vault.
# Sin ellos se usa el adaptador que escribe en el log (local y pruebas).
notificaciones.brevo.url=https://api.brevo.com/v3/smtp/email
notificaciones.brevo.clave-api=${BREVO_API_KEY:}
notificaciones.correo.remitente=${CORREO_REMITENTE:}
notificaciones.correo.nombre-remitente=UCO Test API
# Opcional, para demostraciones: si tiene valor, todos los correos se envian a esta direccion.
notificaciones.correo.redirigir-a=${CORREO_REDIRIGIR_A:}
