name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compilar-y-probar:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ucotestapi
          POSTGRES_USER: ucotestapi
          POSTGRES_PASSWORD: ucotestapi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ucotestapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar Java 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
          cache: maven

      - name: Compilar, pruebas, arquitectura (ArchUnit) y cobertura (JaCoCo)
        run: mvn -B verify

      - name: Análisis de calidad en SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: mvn -B sonar:sonar

  gateway:
    name: Compilar y probar el API Gateway
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
          cache: maven

      - name: Compilar y pruebas del gateway
        run: mvn -B -f gateway/pom.xml verify

      - name: Construir la imagen del gateway
        run: docker build -t uco-test-gateway:ci gateway

  imagen-docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: compilar-y-probar

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t uco-test-api:ci .

  desplegar:
    name: Desplegar en Render (CD)
    runs-on: ubuntu-latest
    needs: [compilar-y-probar, gateway, imagen-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Desplegar la API
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then echo "Falta el secreto RENDER_DEPLOY_HOOK_API"; exit 1; fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Render recibió la orden de desplegar la API"

      - name: Desplegar el gateway
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then echo "Falta el secreto RENDER_DEPLOY_HOOK_GATEWAY"; exit 1; fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Render recibió la orden de desplegar el gateway"
