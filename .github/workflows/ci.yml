name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compilar-y-probar:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ucotestapi
          POSTGRES_USER: ucotestapi
          POSTGRES_PASSWORD: ucotestapi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ucotestapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar Java 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
          cache: maven

      - name: Compilar, pruebas, arquitectura (ArchUnit) y cobertura (JaCoCo)
        run: mvn -B verify

      - name: Análisis de calidad en SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: mvn -B sonar:sonar

  imagen-docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: compilar-y-probar

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t uco-test-api:ci .
